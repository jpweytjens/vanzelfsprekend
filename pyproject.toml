[project]
name = "vanzelfsprekend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Johannes Weytjens", email = "github@peregrinus.be" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "mizani>=0.14",
    "numpy>=2.2.6",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.74",
]

[tool.ruff]
extend-exclude = ["archive"]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N",
  "NPY", "PTH", "TRY", "D",
  "S101",            # errors raise, never assert
  "PT",              # pytest style; PT011: raises(ValueError) needs match
  "ANN",             # type hints on all function signatures
  "PERF",            # no-avoidable-work idioms, list comprehensions
  "FURB",            # modernization, complements UP/SIM/PTH
  "RET",             # early-exit function exits
]
ignore = [
  "TRY003",  # long exception messages are fine here
  "ANN401",  # an honest -> Any is allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN"]  # docstrings are public-API; assert and signatures follow pytest idiom

[tool.ruff.lint.pydocstyle]
convention = "numpy"
