[project]
name = "vanzelfsprekend"
version = "0.1.0"
description = "Tufte and Doumont for matplotlib: range frames and direct labels"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Johannes Weytjens", email = "github@peregrinus.be" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "mizani>=0.14",
    "numpy>=2.2.6",
]
keywords = [
    "matplotlib",
    "tufte",
    "doumont",
    "range-frame",
    "direct-labels",
    "data-visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jpweytjens/vanzelfsprekend"
Repository = "https://github.com/jpweytjens/vanzelfsprekend"
Issues = "https://github.com/jpweytjens/vanzelfsprekend/issues"
Changelog = "https://github.com/jpweytjens/vanzelfsprekend/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
filterwarnings = [
  # mizani's internal date arithmetic trips a numpy deprecation; not ours to fix
  "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:mizani.*",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N",
  "NPY", "PTH", "TRY", "D",
  "S101",            # errors raise, never assert
  "PT",              # pytest style; PT011: raises(ValueError) needs match
  "ANN",             # type hints on all function signatures
  "PERF",            # no-avoidable-work idioms, list comprehensions
  "FURB",            # modernization, complements UP/SIM/PTH
  "RET",             # early-exit function exits
]
ignore = [
  "TRY003",  # long exception messages are fine here
  "ANN401",  # an honest -> Any is allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN"]  # docstrings are public-API; assert and signatures follow pytest idiom

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
# Pin the venv so the ty language server resolves third-party imports
# even when a stale VIRTUAL_ENV is exported in the parent shell.
python = "./.venv"
