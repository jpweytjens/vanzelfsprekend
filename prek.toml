exclude = "^archive/"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.4"
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.12.5"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks" }]

[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.11"
hooks = [{ id = "committed", stages = ["commit-msg"] }]

[[repos]]
repo = "local"
hooks = [
  { id = "reference-dir-guard", name = "archive/ and docs/superpowers/ stay uncommitted", language = "system", entry = "bash -c 'changed=$(git diff --cached --name-only -- archive/ docs/superpowers/); if [ -n \"$changed\" ]; then printf \"%s\\n\" \"$changed\" >&2; echo \"archive/ is reference-only and docs/superpowers/ is local-only\" >&2; exit 1; fi'", pass_filenames = false, always_run = true },
]
